[package]
name = "job_notifier_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17", features = ["macros", "redis-storage", "bincode-serializer"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
scraper = "0.22"
diesel = { version = "2.2.0", features = ["postgres", "r2d2", "chrono"] }
diesel_migrations = { version = "2.2.0", features = ["postgres"] }
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
bb8 = "0.9.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
redis = { version = "1.2.4", features = ["tokio-comp", "connection-manager"] }
log = "0.4"
env_logger = "0.11"
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"
sha2 = "0.10"
urlencoding = "2.1"
